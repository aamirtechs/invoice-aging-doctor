[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-aging-doctor"
version = "1.0.0"
description = "Offline invoice aging report CLI from a JSON invoice export"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
invoice-aging-doctor = "invoice_aging_doctor:main"

[tool.setuptools]
py-modules = ["invoice_aging_doctor"]
